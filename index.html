<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mass Ad Campaign Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        safelist: [
          'sm:grid-cols-2',
          'sm:grid-cols-3',
          'xl:grid-cols-4',
          'sm:w-auto',
          'sm:self-start',
          'gap-px',
          'h-full',
          'min-h-0',
          'flex-1',
          'shrink-0',
          'leading-none',
          'leading-tight',
          'leading-snug',
          'tracking-tight',
          'tabular-nums',
          'line-clamp-2',
          'text-emerald-600',
          'text-emerald-700',
          'text-amber-600',
          'bg-emerald-50',
          'border-emerald-100',
          'bg-violet-50/50',
          'border-violet-100',
          'bg-[#9a41fe]',
          'hover:bg-[#8840e5]',
          'shadow-[#9a41fe]/25',
          'max-w-[480px]',
          'z-[110]',
          'z-[120]',
          'ring-1',
          'ring-black/[0.03]',
        ],
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: 'Inter', sans-serif;
        background-color: #EEF1F5;
      }
      #root {
        min-height: 100vh;
        background-color: #EEF1F5;
      }
      /* Custom scrollbar for table */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .pagination-container {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        padding-top: 16px;
      }
      .pagination-item {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 14px;
        user-select: none;
        background-color: white;
      }
      .pagination-item:hover {
        border-color: #8b5cf6;
        color: #8b5cf6;
      }
      .pagination-item.active {
        background-color: #8b5cf6;
        border-color: #8b5cf6;
        color: white;
        font-weight: 600;
      }
      .pagination-item.disabled {
        color: rgba(0, 0, 0, 0.25);
        background-color: #f9fafb;
        border-color: #d1d5db;
        cursor: not-allowed;
      }
      .table-header-cell:hover {
        z-index: 25;
      }
      /* Custom Tooltip Styles */
      .tooltip {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tooltip .tooltip-text {
        visibility: hidden;
        opacity: 0;
        width: max-content;
        background-color: #1f2937; /* gray-800 */
        color: #fff;
        text-align: center;
        border-radius: 0.375rem; /* rounded-md */
        padding: 0.25rem 0.75rem; /* py-1 px-3 */
        position: absolute;
        z-index: 30;
        bottom: 120%;
        left: 50%;
        transform: translateX(-50%);
        transition: opacity 0.2s;
        font-size: 0.75rem; /* text-xs */
        font-weight: 500; /* font-medium */
        pointer-events: none;
      }

      .tooltip:hover .tooltip-text {
        visibility: visible;
        opacity: 1;
      }
      /* Hide arrows from number inputs */
      .hide-arrows::-webkit-outer-spin-button,
      .hide-arrows::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .hide-arrows {
        -moz-appearance: textfield;
      }

      /* Bonus repeat block: CDN may miss classes from bundled JS on Vercel */
      .campaign-repeat-performance__grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem;
        align-items: stretch;
      }
      @media (min-width: 640px) {
        .campaign-repeat-performance__grid--cols-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .campaign-repeat-performance__success-row {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem 1.25rem 1.25rem;
      }
      .campaign-repeat-performance__success-cta {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (min-width: 768px) {
        .campaign-repeat-performance__success-row {
          flex-direction: row;
          align-items: stretch;
          gap: 1rem;
        }
        .campaign-repeat-performance__success-cta {
          flex: 1 1 30%;
          max-width: 30%;
          min-width: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
          padding: 0.25rem 0.5rem 0.25rem 0;
        }
        .campaign-repeat-performance__success-metrics {
          flex: 1 1 70%;
          min-width: 0;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1rem;
          align-items: stretch;
        }
      }
      .campaign-repeat-performance__card {
        display: flex;
        height: 100%;
        min-height: 100%;
        flex-direction: column;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        background: #fff;
        padding: 0.75rem 1rem;
      }
      .campaign-repeat-performance__card-body {
        display: flex;
        min-height: 0;
        flex: 1 1 auto;
        flex-direction: column;
        gap: 1px;
      }

      .ranking-factors-panel {
        animation: ranking-panel-slide-in 0.3s ease-out;
      }
      @keyframes ranking-panel-slide-in {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
